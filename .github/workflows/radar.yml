name: radar

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 采集
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect.mjs

      - name: 渲染站点与 README
        run: node scripts/render.mjs

      - name: 提交数据
        run: |
          git config user.name 123caiji
          git config user.email 166346449+123caiji@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "chore(radar): 自动采集 $(date -u +'%Y-%m-%dT%H:%MZ')"
          # 采集要跑几分钟，期间可能有人工提交把 main 推进；rebase 后重试
          for i in 1 2 3; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $i)"
            git pull --rebase --autostash origin main || git rebase --abort || true
          done
          echo "::error::push failed after 3 attempts"
          exit 1

      # GITHUB_TOKEN 提交的 push 不会触发其它 workflow，所以显式 dispatch pages.yml
      - name: 触发 Pages 部署
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo ${{ github.repository }}

