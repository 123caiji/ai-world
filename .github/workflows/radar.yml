name: radar

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 采集
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect.mjs

      - name: 渲染站点与 README
        run: node scripts/render.mjs

      - name: 提交数据
        run: |
          git config user.name 123caiji
          git config user.email 166346449+123caiji@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(radar): 自动采集 $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi

      # GITHUB_TOKEN 提交的 push 不会触发其它 workflow，所以显式 dispatch pages.yml
      - name: 触发 Pages 部署
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo ${{ github.repository }}

