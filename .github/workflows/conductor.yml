name: conductor

# radar 链的看门狗。
# 采集节奏由 scripts/lib/keeper.mjs 的自愈链维持（每轮开始先排下一轮），
# 所以 radar.yml 里没有 cron —— 那里留 cron 会把链子已排好的 pending 顶成 cancelled
# （concurrency 只给「1 running + 1 pending」两个名额）。
# 这里只在「radar 一个在跑/排队的 run 都没有」且「feed 已经过期」时才补派一次，
# 因此永远不会顶掉任何排队中的 run。
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: conductor
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: 链子断了就补派一轮采集
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          active=$(gh api "/repos/${REPO}/actions/workflows/radar.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          echo "radar active runs: ${active}"
          if [ "${active}" != "0" ]; then
            echo "链子还在，不打扰"
            exit 0
          fi

          # 链子空了：看数据有多旧，才决定要不要补
          age=$(node -e '
            const repo = process.env.REPO;
            const url = "https://raw.githubusercontent.com/" + repo + "/main/data/site.json";
            fetch(url)
              .then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
              .then((j) => {
                const t = new Date(j.feedGeneratedAt || j.generatedAt).getTime();
                console.log(Math.round((Date.now() - t) / 60000));
              })
              .catch((e) => { console.error("读 site.json 失败: " + e.message); console.log("999999"); });
          ')
          echo "feed age: ${age}min"

          if [ "${age}" -ge 120 ]; then
            echo "链子断了（feed ${age} 分钟没更新），补派一轮"
            gh workflow run radar.yml --repo "${REPO}"
          else
            echo "链子断了但数据还新（${age}min），下一小时再看"
          fi
